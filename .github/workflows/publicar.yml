# Publica la app en GitHub Pages cada vez que se actualiza la rama principal.
# Requiere activar Pages en Settings → Pages → Source: «GitHub Actions», y que el repositorio sea
# público (o un plan de pago). Paso a paso: docs/PUBLICAR.md
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar contenido antes de publicar
        run: node tools/validar-contenido.mjs
      # Si se editó contenido directamente en GitHub, la lista para uso sin conexión y la
      # versión del service worker se actualizan aquí, así los teléfonos reciben los cambios.
      - name: Actualizar la lista para uso sin conexión
        run: node tools/generar-precache.mjs
      - name: Preparar archivos
        run: node tools/preparar-sitio.mjs _sitio
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: deployment
        uses: actions/deploy-pages@v4
